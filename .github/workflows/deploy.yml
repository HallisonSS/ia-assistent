name: Deploy IA Assistant

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ia-assistant-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
  deploy:
    name: Build and Deploy agent-api
    runs-on: self-hosted, Linux, X64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Validate Compose
        run: |
          docker compose config --quiet

      - name: Build agent-api image
        run: |
          docker compose build agent-api

      - name: Recreate agent-api
        run: |
          docker compose up -d \
            --no-deps \
            --force-recreate \
            agent-api

      - name: Verify agent-api
        run: |
          docker compose ps agent-api
          docker compose logs --tail=50 agent-api

      - name: Remove unused Docker images
        if: success()
        run: |
          docker image prune -f

      - name: Deployment summary
        if: success()
        run: |
          echo "Deploy do agent-api concluído."
          docker image ls


          
