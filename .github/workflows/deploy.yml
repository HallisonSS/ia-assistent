name: ci-cd
on:
  push:
    branches: main

jobs:
  deploy:
    runs-on: self-hosted, Linux, X64
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKER_USER }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push
        run: |
          docker build -t $DOCKERHUB_USER/agent-api:$IMAGE_TAG .
          docker push $DOCKERHUB_USER/agent-api:$IMAGE_TAG

      - name: Deploy
        run: |
          docker compose pull
          docker compose up -d
