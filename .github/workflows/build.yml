
name: Testar runner Ubuntu

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-runner:
    runs-on: self-hosted, Linux, X64

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Identificar o ambiente
        run: |
          echo "Runner conectado com sucesso"
          hostname
          uname -a

      - name: Verificar Docker
        run: |
          docker --version
          docker compose version
